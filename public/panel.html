<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twinclue Control Panel</title><link rel="stylesheet" href="/panel.css"></head><body><header><div class="identity"><img src="/logo.svg" alt=""><div><div class="brand">TWINCLUE</div><h1>Show control</h1></div></div><span id="demo" class="demo" hidden>DEMO MODE</span></header><main><section class="connections"><article class="community-a"><span class="status-dot" id="status-a"></span><div><small>COMMUNITY A</small><strong id="channel-a">Disconnected</strong></div></article><article class="community-b"><span class="status-dot" id="status-b"></span><div><small>COMMUNITY B</small><strong id="channel-b">Disconnected</strong></div></article></section><section class="controls"><div class="actions"><button id="start" class="primary">Start round</button><button id="lock" class="secondary">Lock votes now</button><button id="skip" class="secondary">Skip round</button></div><div class="settings"><label>Category<select id="category"><option>general</option><option>games</option><option>music</option><option>science</option><option>sport</option><option>food</option><option>geography</option><option>movies</option></select></label><label>Difficulty<select id="difficulty"><option>easy</option><option>medium</option><option>hard</option></select></label><label>Round length <span id="duration-label">90 seconds</span><input id="duration" type="range" min="30" max="300" step="15" value="90"></label></div></section><section class="score"><span>SESSION SCORE</span><strong id="wins">0</strong><small id="wins-label">wins</small><span class="streak-label">CURRENT STREAK</span><strong id="streak">0</strong></section><section class="previews"><div class="section-title"><h2>Live overlay preview</h2><span>1920 × 1080 source</span></div><div class="preview-grid"><article class="preview-a"><b>COMMUNITY A</b><iframe title="Community A overlay preview" src="/overlay/a"></iframe></article><article class="preview-b"><b>COMMUNITY B</b><iframe title="Community B overlay preview" src="/overlay/b"></iframe></article></div></section><section class="activity"><h2>Recent votes</h2><div class="columns"><article class="community-a"><h3>Community A</h3><ul id="guesses-a"></ul></article><article class="community-b"><h3>Community B</h3><ul id="guesses-b"></ul></article></div></section><p id="message" role="status"></p></main><script src="/panel.js"></script></body></html>
